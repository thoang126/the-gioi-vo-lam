<title>Vạn Kiếp Thiên Hạ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: bàn làm việc của một linh hồn. Trái là thiên hạ (bản đồ, tin tức), phải là kiếp đang sống; ngã rẽ luôn nằm trên cùng cột phải. Thủy mặc theo ADR-0008 của Luân Hồi Vạn Kiếp: giấy, mực, một dấu triện son. */
:root {
  --paper: #efeadf; --paper-2: #e4ddcd; --paper-3: #d9d1bf;
  --ink: #1d1f22; --ink-2: #4f5559; --ink-3: #6b7073;
  --sea: #d5dbd6; --seal: #b23a2a; --seal-soft: rgba(178, 58, 42, 0.1); --gold: #7f611a;
  --line: rgba(29, 31, 34, 0.16);
  --font-display: "Alegreya", "Noto Serif", Georgia, serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16181a; --paper-2: #1f2225; --paper-3: #2c3033; --ink: #e8e3d6; --ink-2: #b0ada3; --ink-3: #8e8c84;
    --sea: #1b2225; --seal: #e3694f; --seal-soft: rgba(227, 105, 79, 0.13); --gold: #d6b25e; --line: rgba(232, 227, 214, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16181a; --paper-2: #1f2225; --paper-3: #2c3033; --ink: #e8e3d6; --ink-2: #b0ada3; --ink-3: #8e8c84;
  --sea: #1b2225; --seal: #e3694f; --seal-soft: rgba(227, 105, 79, 0.13); --gold: #d6b25e; --line: rgba(232, 227, 214, 0.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
kbd { font-family: var(--font-body); font-size: .72rem; font-weight: 600; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--paper); color: var(--ink-2); }
.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
.seal { color: var(--seal); }
.muted { color: var(--ink-2); }
.small { font-size: .82rem; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }

/* Header */
header.bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.7rem; font-weight: 800; }
.date { font-family: var(--font-display); font-size: 1.1rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.timebar, .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; justify-self: center; }
.seg-btn { border: none; background: var(--paper); padding: 7px 12px; border-left: 1px solid var(--line); white-space: nowrap; }
.seg-btn:first-child { border-left: none; }
.seg-btn:hover:not(:disabled) { background: var(--paper-3); }
.seg-btn.on { background: var(--ink); color: var(--paper); }
#mapview { flex-wrap: wrap; max-width: 100%; justify-self: auto; }
.seg.small .seg-btn { padding: 4px 10px; font-size: .82rem; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--paper-2); padding: 6px 12px; border-radius: 4px; }
.btn:hover { background: var(--paper-3); }
.btn.danger { border-color: var(--seal); color: var(--seal); background: var(--seal-soft); }
.btn.small { padding: 3px 10px; font-size: .82rem; }
label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--ink-2); cursor: pointer; }
.status { grid-column: 1 / -1; margin: 0; color: var(--ink-2); }

.intro { background: var(--paper-2); border-radius: 4px; padding: 12px 16px; display: grid; gap: 6px; justify-items: start; }
.intro p { margin: 0; max-width: 75ch; font-size: .92rem; }

.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }

/* Map */
.map-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.map-head .seg { justify-self: auto; }
.map-wrap { border: 1px solid var(--line); border-radius: 4px; background: var(--sea); overflow: hidden; }
.map-wrap svg { display: block; width: 100%; height: auto; max-height: 70vh; }
.land { fill: var(--paper-2); stroke: var(--ink); stroke-opacity: .45; stroke-width: 1.3; }
.land.evil { fill: color-mix(in srgb, var(--paper-2) 82%, #7a1f1f); }
.land.wildland { fill: color-mix(in srgb, var(--paper-2) 82%, #2f6b3a); }
.land.heaven { fill: color-mix(in srgb, var(--paper-2) 85%, #c9a227); stroke-dasharray: 6 4; }
.route { stroke: var(--ink); stroke-opacity: .18; stroke-width: 1.2; fill: none; }
.route.sea { stroke: var(--seal); stroke-opacity: .7; stroke-dasharray: 6 5; }
.war-line { stroke: var(--seal); stroke-width: 2.5; stroke-dasharray: 3 4; fill: none; }
.region { cursor: pointer; }
.region .dot { fill: var(--ink); stroke: var(--paper); stroke-width: 2; }
.region.wild .dot { fill: var(--ink-2); }
.region.evil .dot { fill: var(--seal); }
.region:hover .dot, .region:focus-visible .dot { stroke: var(--seal); stroke-width: 3; }
.region.sel .dot { stroke: var(--seal); stroke-width: 3; }
.region text { font-family: var(--font-display); font-weight: 700; font-size: 14px; fill: var(--ink); paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; stroke-linejoin: round; }
.region .count { font-family: var(--font-body); font-size: 10.5px; font-weight: 500; fill: var(--ink-2); }
.view-mortal .region text, .view-cultivation .region text { font-size: 12px; }
.view-overseas .region text, .view-demonic .region text, .view-demon_beast .region text { font-size: 10px; }
.view-overseas .region .count, .view-demonic .region .count, .view-demon_beast .region .count { font-size: 8px; }
.view-mortal .region .count, .view-cultivation .region .count { font-size: 9.5px; }
.player-ring { fill: none; stroke: var(--seal); stroke-width: 2.5; }
.player-ring.waiting { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { stroke-width: 5; opacity: .55; } }
.player-tag { font-family: var(--font-body); font-size: 11px; font-weight: 600; fill: var(--seal); paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; }
.secret-ring { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 2 3; }
.region-label-big { font-family: var(--font-display); font-weight: 800; fill: var(--ink); opacity: .12; letter-spacing: .08em; }
.sea-label { font-family: var(--font-body); font-size: 11px; letter-spacing: 2px; fill: var(--ink-2); }

/* Tabs and feeds */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: none; background: none; padding: 8px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--seal); }
.tabpanel { max-height: 460px; overflow-y: auto; padding: 8px 4px 0 0; }
.filters { margin-bottom: 10px; }
.chip-btn { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--ink-2); }
.chip-btn.on { border-color: var(--ink); color: var(--ink); background: var(--paper-2); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; font-size: .92rem; position: relative; padding-left: 12px; }
.feed li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.feed li.g-war::before { background: var(--seal); }
.feed li.g-fortune::before { background: var(--gold); }
.feed li.g-sect::before { background: var(--ink); }
.feed li.g-life::before { background: var(--ink-3); }
.feed li.k-past_life::before { background: var(--seal); width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); }
.feed .yr { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: .8rem; padding-top: 2px; white-space: nowrap; }
.feed li.k-past_life .txt { color: var(--seal); }
.feed li.k-soul .txt { font-style: italic; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.me td { background: var(--seal-soft); }
.linkish { background: none; border: none; padding: 0; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--seal); }
.profile { display: grid; gap: 10px; }

/* Player side */
.card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: grid; gap: 10px; }
.card.choice { border: 2px solid var(--seal); background: var(--seal-soft); }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.who h2 { font-size: 1.6rem; font-weight: 800; }
.realm { font-family: var(--font-display); font-size: 1.15rem; color: var(--seal); font-weight: 700; }
.goal { margin: 0; font-size: .88rem; border-left: 3px solid var(--gold); padding-left: 10px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.meter { display: grid; gap: 3px; font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter .track { height: 6px; background: var(--paper-3); border-radius: 1px; overflow: hidden; }
.meter .track span { display: block; height: 100%; background: var(--ink); transition: width .3s; }
.meter.life .track span { background: var(--ink-3); }
.meter.life.low .track span { background: var(--seal); }
.meter.act .track span { background: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; }
.stats div { background: var(--paper); border-radius: 3px; padding: 4px 2px; cursor: help; }
.stats b { display: block; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.stats span { font-size: .7rem; color: var(--ink-2); }
.choice p.prompt { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
.options { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--ink); background: var(--paper); border-radius: 4px; padding: 9px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.opt:hover { border-color: var(--seal); background: var(--paper-2); box-shadow: inset 3px 0 0 var(--seal); }
.opt kbd { margin-top: 2px; }
.opt-text { display: grid; gap: 2px; }
.opt small { color: var(--ink-2); font-size: .8rem; }
.rels-box summary { cursor: pointer; list-style: revert; }
.rels { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: .88rem; }
.rels .dead { color: var(--ink-3); }
.rels .dead .linkish { text-decoration-line: line-through; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.center { justify-content: center; }
.chip { font-size: .78rem; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 1px 8px; }

/* Luận Kiếm */
.replay { margin-bottom: 12px; }
.fighters { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.fighter { display: grid; gap: 4px; min-width: 0; }
.fighter.won b { color: var(--seal); }
.vs { font-family: var(--font-display); font-style: italic; color: var(--ink-2); }
.turns { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .88rem; }
.turns .tone-big { color: var(--seal); font-weight: 600; }
.turns .tone-status { color: var(--ink-2); font-style: italic; }

/* Kiếp Sách */
.goals { display: grid; gap: 8px; margin: 8px 0 12px; background: var(--paper-2); padding: 12px; border-radius: 4px; }
.goal-row { display: grid; gap: 4px; font-size: .9rem; }
.soul-titles { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; gap: 6px; font-size: .9rem; }
.soul-titles li { padding-left: 18px; position: relative; color: var(--ink-2); }
.soul-titles li::before { content: ""; position: absolute; left: 0; top: .45em; width: 9px; height: 9px; border: 1.5px solid var(--ink-3); border-radius: 2px; }
.soul-titles li.done { color: var(--ink); }
.soul-titles li.done::before { background: var(--seal); border-color: var(--seal); }
.codex-cat { display: grid; gap: 6px; margin-top: 14px; }
.codex-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.codex-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.codex-item { font-size: .8rem; border: 1px dashed var(--line); border-radius: 3px; padding: 2px 8px; color: var(--ink-3); }
.codex-item.on { border: 1px solid var(--ink); color: var(--ink); background: var(--paper); }

/* Tombstone */
.stele { background: var(--paper); border: 1px solid var(--ink); border-radius: 48% 48% 4px 4px / 22% 22% 4px 4px; padding: 26px 18px 18px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.stele-name { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; }
.stele-years { font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stele-realm { font-family: var(--font-display); font-size: 1.2rem; color: var(--seal); font-weight: 700; }
.stele-cause { margin: 0; font-style: italic; max-width: 40ch; }
.stele p { margin: 0; }
.stele-score { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; }
.stele-score span { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.stele-score b { font-family: var(--font-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }

@media (max-width: 960px) {
  .main { grid-template-columns: 1fr; }
  .player-col { order: -1; }
  header.bar { grid-template-columns: 1fr auto; }
  .timebar { grid-column: 1 / -1; justify-self: stretch; }
  .timebar .seg-btn { flex: 1; }
}
@media (max-width: 520px) {
  .brand h1 { font-size: 1.4rem; }
  header.bar { grid-template-columns: 1fr; }
  .controls { justify-content: flex-start; }
  .seg-btn { padding: 7px 8px; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .feed li { grid-template-columns: 52px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
<div class="app" id="app"></div>
<!--APP-->
