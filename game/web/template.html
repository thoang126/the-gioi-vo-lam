<title>Vạn Kiếp Thiên Hạ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: bàn làm việc của một linh hồn. Trái là thiên hạ (bản đồ, tin tức), phải là kiếp đang sống. Thủy mặc theo ADR-0008 của Luân Hồi Vạn Kiếp. */
:root {
  --paper: #efeadf; --paper-2: #e4ddcd; --paper-3: #d9d1bf;
  --ink: #1d1f22; --ink-2: #545a5f; --ink-3: #8b8f90;
  --sea: #d5dbd6; --seal: #b23a2a; --seal-soft: rgba(178, 58, 42, 0.12); --gold: #8a6a1f;
  --line: rgba(29, 31, 34, 0.16);
  --font-display: "Alegreya", "Noto Serif", Georgia, serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16181a; --paper-2: #1f2225; --paper-3: #2a2e31; --ink: #e8e3d6; --ink-2: #a9a69c; --ink-3: #74736c;
    --sea: #1b2225; --seal: #e0644f; --seal-soft: rgba(224, 100, 79, 0.14); --gold: #d2ae5a; --line: rgba(232, 227, 214, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16181a; --paper-2: #1f2225; --paper-3: #2a2e31; --ink: #e8e3d6; --ink-2: #a9a69c; --ink-3: #74736c;
  --sea: #1b2225; --seal: #e0644f; --seal-soft: rgba(224, 100, 79, 0.14); --gold: #d2ae5a; --line: rgba(232, 227, 214, 0.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }

header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.brand h1 { font-size: 1.7rem; font-weight: 800; }
.date { font-family: var(--font-display); font-size: 1.1rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--paper-2); padding: 6px 12px; border-radius: 4px; }
.btn:hover { background: var(--paper-3); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
select.btn { padding: 6px 8px; }
label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--ink-2); }

.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }

.map-wrap { border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; background: var(--sea); }
.map-wrap svg { display: block; width: 100%; min-width: 560px; height: auto; }
.land { fill: var(--paper-2); stroke: var(--ink); stroke-opacity: .45; stroke-width: 1.3; }
.route { stroke: var(--ink); stroke-opacity: .18; stroke-width: 1.2; fill: none; }
.route.sea { stroke: var(--seal); stroke-opacity: .7; stroke-dasharray: 6 5; }
.war-line { stroke: var(--seal); stroke-width: 2.5; stroke-dasharray: 3 4; fill: none; }
.region { cursor: pointer; }
.region .dot { fill: var(--ink); stroke: var(--paper); stroke-width: 2; }
.region.wild .dot { fill: var(--ink-2); }
.region.sect .dot { fill: var(--ink); }
.region.evil .dot { fill: var(--seal); }
.region.sel .dot { stroke: var(--seal); stroke-width: 3; }
.region text { font-family: var(--font-display); font-weight: 700; font-size: 14px; fill: var(--ink); paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; stroke-linejoin: round; }
.region .count { font-family: var(--font-body); font-size: 10.5px; font-weight: 500; fill: var(--ink-2); }
.player-ring { fill: none; stroke: var(--seal); stroke-width: 2.5; }
.player-tag { font-family: var(--font-body); font-size: 11px; font-weight: 600; fill: var(--seal); paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; }
.secret-ring { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 2 3; }
.region-label-big { font-family: var(--font-display); font-weight: 800; fill: var(--ink); opacity: .12; letter-spacing: .08em; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: none; background: none; padding: 8px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--seal); }
.tabpanel { max-height: 460px; overflow-y: auto; padding-right: 4px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; font-size: .92rem; }
.feed .yr { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: .82rem; padding-top: 2px; }
.feed li.past_life .txt { color: var(--seal); }
.feed li.soul .txt { font-style: italic; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.linkish { background: none; border: none; padding: 0; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--seal); }

.card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: grid; gap: 10px; }
.card.choice { border: 2px solid var(--seal); background: var(--seal-soft); }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.who h2 { font-size: 1.6rem; font-weight: 800; }
.realm { font-family: var(--font-display); font-size: 1.15rem; color: var(--seal); font-weight: 700; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .9rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.meter { display: grid; gap: 3px; font-size: .8rem; color: var(--ink-2); }
.meter .track { height: 6px; background: var(--paper-3); border-radius: 1px; overflow: hidden; }
.meter .track span { display: block; height: 100%; background: var(--ink); }
.meter.life .track span { background: var(--seal); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; }
.stats div { background: var(--paper); border-radius: 3px; padding: 4px 2px; }
.stats b { display: block; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.stats span { font-size: .7rem; color: var(--ink-2); }
.choice p.prompt { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
.options { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--ink); background: var(--paper); border-radius: 4px; padding: 8px 12px; display: grid; gap: 2px; }
.opt:hover { background: var(--ink); color: var(--paper); }
.opt small { color: var(--ink-2); font-size: .8rem; }
.opt:hover small { color: var(--paper-3); }
.rels { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .88rem; }
.rels .dead { color: var(--ink-3); text-decoration: line-through; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 1px 8px; }
.muted { color: var(--ink-2); }
.small { font-size: .82rem; }
.intro { font-size: .9rem; color: var(--ink-2); max-width: 70ch; margin: 0; }

@media (max-width: 960px) { .main { grid-template-columns: 1fr; } .player-col { order: -1; } }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .feed li { grid-template-columns: 52px minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="app" id="app"></div>
<!--APP-->
